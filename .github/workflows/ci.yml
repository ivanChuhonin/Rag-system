name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Import smoke test
        run: |
          python -c "
          import rag.ask, rag.api, rag.chunk, rag.config, rag.embed_index
          import rag.search, rag.storage, rag.stopwords_ru, rag.text_clean
          import scripts.vk_parse, scripts.eval_recall, scripts.run_prompts, scripts.clean_existing
          print('OK')
          "

      # Top-level smoke-imports don't execute lazy imports inside functions
      # (e.g. search.py's `from embed_index import ...` used to be stale
      # after the rag/ package move and only broke at request time).
      - name: Check for un-prefixed intra-package imports
        run: |
          ! grep -rnE '^\s*(import|from)\s+(embed_index|config|search|ask|storage|chunk|text_clean|stopwords_ru|vk_parse|eval_recall|run_prompts|clean_existing)\b' rag scripts
