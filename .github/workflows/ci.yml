name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Import smoke test
        run: |
          python -c "
          import rag.ask, rag.api, rag.chunk, rag.config, rag.embed_index
          import rag.search, rag.storage, rag.stopwords_ru, rag.text_clean
          import scripts.vk_parse, scripts.eval_recall, scripts.run_prompts, scripts.clean_existing
          print('OK')
          "
