name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Import smoke test
        run: |
          python -c "
          import ask, api, chunk, clean_existing, config, embed_index
          import eval_recall, run_prompts, search, storage, stopwords_ru
          import text_clean, vk_parse
          print('OK')
          "
